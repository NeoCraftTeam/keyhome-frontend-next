# ──────────────────────────────────────────────────────────────────────────────
# KeyHome — Frontend CI/CD Pipeline
#
# Branches :
#   main       → déploiement Production  (Vercel prod)
#   cedrickdev → déploiement Preprod     (Vercel preview)
#   autres     → quality + build:check uniquement (pas de deploy)
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   NEXT_PUBLIC_API_URL                   URL API backend (prod)
#   NEXT_PUBLIC_API_URL_PREPROD           URL API backend (preprod) — utilisé par Lighthouse
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY     Clerk publishable key
#   CLERK_SECRET_KEY                      Clerk secret key              [masked]
#   NEXT_PUBLIC_MAPBOX_TOKEN              Mapbox GL public token
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY          Web Push VAPID public key
#   NEXT_PUBLIC_AGENCY_URL                Agency panel URL
#   NEXT_PUBLIC_OWNER_URL                 Owner panel URL
#   NEXT_PUBLIC_ADMIN_URL                 Admin panel URL
#   SLACK_WEBHOOK_FRONTEND                (optional) Slack incoming webhook
#   LHCI_TOKEN                            (optional) Lighthouse CI server token
#   CACHE_PREFIX                          Incrémenter (ex: v2) pour invalider le cache
#   VERCEL_TOKEN                          Vercel personal access token  [masked]
#   VERCEL_ORG_ID                         Vercel team/org ID            [masked]
#   VERCEL_PROJECT_ID                     Vercel project ID             [masked]
#
# IMPORTANT — désactiver l'auto-deploy Vercel depuis GitHub/GitLab :
#   Vercel dashboard → Project → Settings → Git → "Ignored Build Step" → exit 1
# ──────────────────────────────────────────────────────────────────────────────

workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - prepare
  - quality
  - test
  - build
  - e2e
  - security
  - lighthouse
  - deploy
  - notify

variables:
  NODE_VERSION: "20"
  CACHE_PREFIX: "v1"

# Les jobs de deploy ne doivent JAMAIS être interrompus (risque de deploy partiel)
# Tous les autres jobs sont interruptibles (nouveau push annule le pipeline en cours)
default:
  interruptible: true

# ── Templates partagés ────────────────────────────────────────────────────────

# Base pour tout job qui a besoin de node_modules
.node_job:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      prefix: "$CACHE_PREFIX"
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

# Variables build-time pour Next.js (prod)
.build_vars_prod:
  variables:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    CLERK_SECRET_KEY: $CLERK_SECRET_KEY
    NEXT_PUBLIC_MAPBOX_TOKEN: $NEXT_PUBLIC_MAPBOX_TOKEN
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: $NEXT_PUBLIC_VAPID_PUBLIC_KEY
    NEXT_PUBLIC_AGENCY_URL: $NEXT_PUBLIC_AGENCY_URL
    NEXT_PUBLIC_OWNER_URL: $NEXT_PUBLIC_OWNER_URL
    NEXT_PUBLIC_ADMIN_URL: $NEXT_PUBLIC_ADMIN_URL

# Variables build-time pour Next.js (preprod) — pointe sur l'API preprod
.build_vars_preprod:
  variables:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL_PREPROD
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    CLERK_SECRET_KEY: $CLERK_SECRET_KEY
    NEXT_PUBLIC_MAPBOX_TOKEN: $NEXT_PUBLIC_MAPBOX_TOKEN
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: $NEXT_PUBLIC_VAPID_PUBLIC_KEY
    NEXT_PUBLIC_AGENCY_URL: $NEXT_PUBLIC_AGENCY_URL
    NEXT_PUBLIC_OWNER_URL: $NEXT_PUBLIC_OWNER_URL
    NEXT_PUBLIC_ADMIN_URL: $NEXT_PUBLIC_ADMIN_URL

# ── 1. PREPARE ────────────────────────────────────────────────────────────────
install:
  stage: prepare
  extends: .node_job
  cache:
    key:
      prefix: "$CACHE_PREFIX"
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push          # Ce job alimente le cache, les autres lisent seulement
  script:
    - npm ci --prefer-offline
  retry: 1
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 2. QUALITY (tous en parallèle, toutes les branches) ──────────────────────
typecheck:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npx tsc --noEmit
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

lint:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npm run lint
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

format:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npm run format:check
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 3. TEST ───────────────────────────────────────────────────────────────────
test:unit:
  stage: test
  extends: .node_job
  needs: [typecheck, lint, format]
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 4. BUILD ─────────────────────────────────────────────────────────────────
#
# STRATÉGIE :
#   - Branches feature     → build:check (vérifie que ça compile, pas d'artifact)
#   - main                 → build:prod  (vercel build prod, artifact .vercel/output)
#   - cedrickdev           → build:preprod (vercel build preview, artifact .vercel/output)
#
# On utilise `vercel build` (pas `npm run build`) pour produire directement
# le .vercel/output prêt à déployer avec `vercel deploy --prebuilt`.
# → UN SEUL BUILD par pipeline, pas de double build.
# ─────────────────────────────────────────────────────────────────────────────

# Branches feature : vérifie que next build passe, sans stocker d'artifact
build:check:
  stage: build
  extends:
    - .node_job
    - .build_vars_prod
  needs: [test:unit]
  script:
    - npm run build
  retry:
    max: 2
    when: runner_system_failure
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "cedrickdev"

# main → build Vercel production
build:prod:
  stage: build
  extends:
    - .node_job
    - .build_vars_prod
  needs: [test:unit]
  script:
    - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx vercel build --prod --token=$VERCEL_TOKEN
  artifacts:
    paths:
      - .vercel/output/
    expire_in: 1 hour
  retry:
    max: 2
    when: runner_system_failure
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# cedrickdev → build Vercel preview (pointe sur API preprod)
build:preprod:
  stage: build
  extends:
    - .node_job
    - .build_vars_preprod
  needs: [test:unit]
  script:
    - npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - npx vercel build --token=$VERCEL_TOKEN
  artifacts:
    paths:
      - .vercel/output/
    expire_in: 1 hour
  retry:
    max: 2
    when: runner_system_failure
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "cedrickdev"

# Storybook — non bloquant, uniquement sur les branches déployées
build:storybook:
  stage: build
  extends: .node_job
  needs: [test:unit]
  script:
    - npm run build-storybook
  artifacts:
    when: always
    paths:
      - storybook-static/
    expire_in: 3 days
  allow_failure: true
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "cedrickdev"

# ── 5. E2E (Playwright) — stage dédié après le build ─────────────────────────
#
# L'image Playwright embarque Chromium + Node.js (Debian/Jammy).
# Elle n'est pas compatible avec le cache Alpine de .node_job,
# donc on relance npm ci dans ce job (inévitable avec cette image).
# ─────────────────────────────────────────────────────────────────────────────
test:e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.44.0-jammy
  extends: .build_vars_preprod           # E2E tourne contre l'API preprod, jamais prod
  needs:
    - job: build:prod
      optional: true
    - job: build:preprod
      optional: true
  script:
    - npm ci --prefer-offline
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  allow_failure: true
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "cedrickdev"

# ── 6. SECURITY ───────────────────────────────────────────────────────────────
#
# audit:deps est allow_failure: true → informatif, ne bloque pas le deploy.
# Il est retiré des `needs` des jobs de deploy pour éviter le comportement
# ambigu (job optionnel dans needs = on attend quand même qu'il finisse).
# ─────────────────────────────────────────────────────────────────────────────
audit:deps:
  stage: security
  extends: .node_job
  needs: [install]
  script:
    - npm audit --audit-level=high --omit=dev
  allow_failure: true
  timeout: 3 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 7. LIGHTHOUSE ─────────────────────────────────────────────────────────────
#
# Tourne contre l'URL preprod (NEXT_PUBLIC_API_URL_PREPROD), jamais contre prod.
# Utilise l'image Puppeteer qui embarque Chromium — stable et maintenable,
# évite l'installation manuelle via apk.
# ─────────────────────────────────────────────────────────────────────────────
lighthouse:
  stage: lighthouse
  image: ghcr.io/puppeteer/puppeteer:latest
  extends: .build_vars_preprod
  needs:
    - job: build:prod
      optional: true
    - job: build:preprod
      optional: true
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run build
    - npm run start &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npx @lhci/cli@latest autorun --config=.lighthouserc.json
  artifacts:
    when: always
    paths:
      - .lighthouseci/
    reports:
      metrics: .lighthouseci/lhr-*.json
    expire_in: 30 days
  allow_failure: true
  retry: 1
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "cedrickdev"

# ── 8. DEPLOY ─────────────────────────────────────────────────────────────────
#
# `vercel deploy --prebuilt` utilise le .vercel/output produit par build:prod
# ou build:preprod. PAS de second build ici.
# interruptible: false → un deploy ne doit jamais être interrompu.
# ─────────────────────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  extends:
    - .node_job
    - .build_vars_prod
  interruptible: false                   # ← CRITIQUE : ne jamais interrompre un deploy
  needs: [build:prod, test:e2e]
  script:
    - DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tail -1)
    - echo "Production URL → $DEPLOY_URL"
    - echo "DEPLOY_URL=$DEPLOY_URL" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 hour
  environment:
    name: production
    url: $DEPLOY_URL
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:preprod:
  stage: deploy
  extends:
    - .node_job
    - .build_vars_preprod
  interruptible: false                   # ← CRITIQUE : ne jamais interrompre un deploy
  needs: [build:preprod, test:e2e]
  script:
    - DEPLOY_URL=$(npx vercel deploy --prebuilt --token=$VERCEL_TOKEN 2>&1 | tail -1)
    - echo "Preprod URL → $DEPLOY_URL"
    - echo "DEPLOY_URL=$DEPLOY_URL" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 hour
  environment:
    name: preview/cedrickdev
    url: $DEPLOY_URL
    auto_stop_in: 7 days
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "cedrickdev"

# ── 9. NOTIFY ─────────────────────────────────────────────────────────────────
#
# Succès → uniquement sur main et cedrickdev (branches déployées)
# Échec  → idem, pas de spam sur les branches feature
# ─────────────────────────────────────────────────────────────────────────────
.notify_base:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "cedrickdev"

notify:success:
  extends: .notify_base
  needs:
    - job: test:unit
      optional: true
    - job: build:prod
      optional: true
    - job: build:preprod
      optional: true
    - job: lighthouse
      optional: true
    - job: deploy:production
      optional: true
    - job: deploy:preprod
      optional: true
  when: on_success
  script:
    - |
      [ -z "$SLACK_WEBHOOK_FRONTEND" ] && echo "SLACK_WEBHOOK_FRONTEND not set, skipping" && exit 0
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ENV_LABEL="Production"
      else
        ENV_LABEL="Preprod (cedrickdev)"
      fi
      curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"attachments\": [{
            \"color\": \"#28a745\",
            \"blocks\": [
              {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"✅ Frontend $ENV_LABEL Déployé\", \"emoji\": true}},
              {\"type\": \"section\", \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Environnement:*\n$ENV_LABEL\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Branche:*\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Auteur:*\n$GITLAB_USER_NAME\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\n\`$SHORT_SHA\`\"}
              ]},
              {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}},
              {\"type\": \"actions\", \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚀 Voir la pipeline\"}, \"style\": \"primary\",
                  \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID\"}
              ]}
            ]
          }]
        }" "$SLACK_WEBHOOK_FRONTEND"

notify:failure:
  extends: .notify_base
  needs:
    - job: typecheck
      optional: true
    - job: lint
      optional: true
    - job: format
      optional: true
    - job: test:unit
      optional: true
    - job: build:prod
      optional: true
    - job: build:preprod
      optional: true
    - job: test:e2e
      optional: true
    - job: lighthouse
      optional: true
    - job: deploy:production
      optional: true
    - job: deploy:preprod
      optional: true
  when: on_failure
  script:
    - |
      [ -z "$SLACK_WEBHOOK_FRONTEND" ] && echo "SLACK_WEBHOOK_FRONTEND not set, skipping" && exit 0
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ENV_LABEL="Production"
      else
        ENV_LABEL="Preprod (cedrickdev)"
      fi
      FAILED_JOBS=$(curl -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?scope[]=failed" 2>/dev/null || echo "[]")
      FAILED_JOB=$(echo "$FAILED_JOBS" | grep -o '"name":"[^"]*"' | head -1 | sed 's/"name":"//;s/"//' || echo "unknown")
      FAILED_STAGE=$(echo "$FAILED_JOBS" | grep -o '"stage":"[^"]*"' | head -1 | sed 's/"stage":"//;s/"//' || echo "unknown")
      [ -z "$FAILED_JOB" ] && FAILED_JOB="unknown"
      [ -z "$FAILED_STAGE" ] && FAILED_STAGE="unknown"
      curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"attachments\": [{
            \"color\": \"#dc3545\",
            \"blocks\": [
              {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚨 Frontend Pipeline Échouée ($ENV_LABEL)\", \"emoji\": true}},
              {\"type\": \"section\", \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Étape:*\n\`$FAILED_STAGE\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Job:*\n\`$FAILED_JOB\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Branche:*\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Auteur:*\n$GITLAB_USER_NAME\"}
              ]},
              {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}},
              {\"type\": \"actions\", \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🔴 Voir l'erreur\"}, \"style\": \"danger\",
                  \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID/failures\"},
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"📋 Logs\"},
                  \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID/failures\"}
              ]}
            ]
          }]
        }" "$SLACK_WEBHOOK_FRONTEND"
