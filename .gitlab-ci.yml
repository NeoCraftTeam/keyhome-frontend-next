# ──────────────────────────────────────────────────────────────────────────────
# KeyHome — Frontend CI pipeline fragment
#
# Include in your root .gitlab-ci.yml with:
#   include:
#     - local: 'keyhome-frontend-next/.gitlab-ci.frontend.yml'
#
# Requires these CI/CD variables to be set in GitLab:
#   - LHCI_GITHUB_APP_TOKEN or LHCI_TOKEN (optional, for LHCI server uploads)
#   - NODE_ENV=production (for build stage)
#   - NEXT_PUBLIC_API_URL, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (for build)
# ──────────────────────────────────────────────────────────────────────────────

stages:
  - install
  - test
  - build
  - lighthouse

variables:
  NODE_VERSION: "20"
  FRONTEND_DIR: "keyhome-frontend-next"

# ── Dependency installation ──────────────────────────────────────────────────
frontend:install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull-push
  script:
    - cd ${FRONTEND_DIR}
    - npm ci --prefer-offline
  only:
    changes:
      - keyhome-frontend-next/**/*

# ── Vitest unit + component tests with coverage ──────────────────────────────
frontend:test:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:install]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  script:
    - cd ${FRONTEND_DIR}
    - npm run test:coverage -- --reporter=verbose
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: ${FRONTEND_DIR}/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: ${FRONTEND_DIR}/coverage/cobertura-coverage.xml
    paths:
      - ${FRONTEND_DIR}/coverage/
    expire_in: 7 days
  only:
    changes:
      - keyhome-frontend-next/**/*

# ── TypeScript type-check ─────────────────────────────────────────────────────
frontend:typecheck:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:install]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  script:
    - cd ${FRONTEND_DIR}
    - npx tsc --noEmit
  only:
    changes:
      - keyhome-frontend-next/**/*

# ── ESLint ────────────────────────────────────────────────────────────────────
frontend:lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:install]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  script:
    - cd ${FRONTEND_DIR}
    - npm run lint
  only:
    changes:
      - keyhome-frontend-next/**/*

# ── Prettier format check ─────────────────────────────────────────────────────
frontend:format:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:install]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  script:
    - cd ${FRONTEND_DIR}
    - npm run format:check
  only:
    changes:
      - keyhome-frontend-next/**/*

# ── Production build ─────────────────────────────────────────────────────────
frontend:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:install, frontend:test:unit, frontend:typecheck]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  script:
    - cd ${FRONTEND_DIR}
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_DIR}/.next/
    expire_in: 1 hour
  only:
    refs:
      - main
      - staging
    changes:
      - keyhome-frontend-next/**/*

# ── Playwright E2E tests ──────────────────────────────────────────────────────
frontend:test:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: [frontend:install]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  variables:
    BASE_URL: "http://localhost:3000"
    CI: "true"
  script:
    - cd ${FRONTEND_DIR}
    - npm run build
    - npm run start &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - ${FRONTEND_DIR}/playwright-report/
      - ${FRONTEND_DIR}/test-results/
    expire_in: 7 days
  only:
    refs:
      - main
      - staging

# ── Lighthouse CI ─────────────────────────────────────────────────────────────
#
# Runs @lhci/cli against the production build.
# Install lhci globally in your runner image, or use npx (slower).
# Set LHCI_TOKEN in GitLab variables to upload results to your LHCI server.
#
frontend:lighthouse:
  stage: lighthouse
  image: node:${NODE_VERSION}-alpine
  needs: [frontend:build]
  cache:
    key:
      files:
        - ${FRONTEND_DIR}/package-lock.json
    paths:
      - ${FRONTEND_DIR}/node_modules/
    policy: pull
  before_script:
    - apk add --no-cache chromium
    - export CHROME_PATH=/usr/bin/chromium-browser
    - export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
  script:
    - cd ${FRONTEND_DIR}
    - npm run start &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npx @lhci/cli@latest autorun --config=.lighthouserc.json
  artifacts:
    when: always
    paths:
      - ${FRONTEND_DIR}/.lighthouseci/
    reports:
      # Lighthouse JSON for GitLab merge request widgets (if supported)
      metrics: ${FRONTEND_DIR}/.lighthouseci/lhr-*.json
    expire_in: 30 days
  allow_failure: true
  only:
    refs:
      - main
      - staging
