# ──────────────────────────────────────────────────────────────────────────────
# KeyHome — Frontend CI pipeline (standalone)
#
# Requires these CI/CD variables to be set in GitLab:
#   - LHCI_TOKEN (optional, for LHCI server uploads)
#   - NODE_ENV=production (for build stage)
#   - NEXT_PUBLIC_API_URL, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (for build)
# ──────────────────────────────────────────────────────────────────────────────

stages:
  - install
  - test
  - build
  - lighthouse

variables:
  NODE_VERSION: "20"

# ── Dependency installation ────────────────────────────────────────────────────
install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - npm ci --prefer-offline
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Vitest unit + component tests with coverage ──────────────────────────────
test:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [install]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH

# ── TypeScript type-check ─────────────────────────────────────────────────
typecheck:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [install]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  script:
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH

# ── ESLint ────────────────────────────────────────────────────────────────
lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [install]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Prettier format check ─────────────────────────────────────────────────
format:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [install]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  script:
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Production build ─────────────────────────────────────────────────────
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  needs: [install, test:unit, typecheck, lint, format]
  variables:
    NODE_ENV: production
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ── Lighthouse CI ───────────────────────────────────────────────────────
#
# Runs @lhci/cli against the production build.
# Set LHCI_TOKEN in GitLab variables to upload results to your LHCI server.
#
lighthouse:
  stage: lighthouse
  image: node:${NODE_VERSION}-alpine
  needs: [build]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  before_script:
    - apk add --no-cache chromium
    - export CHROME_PATH=/usr/bin/chromium-browser
    - export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
  variables:
    NODE_ENV: production
  script:
    - npm run start &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npx @lhci/cli@latest autorun --config=.lighthouserc.json
  artifacts:
    when: always
    paths:
      - .lighthouseci/
    reports:
      metrics: .lighthouseci/lhr-*.json
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"
