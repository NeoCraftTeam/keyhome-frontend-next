# ──────────────────────────────────────────────────────────────────────────────
# KeyHome — Frontend CI pipeline (enterprise)
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   NEXT_PUBLIC_API_URL                   backend API base URL
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY     Clerk publishable key
#   CLERK_SECRET_KEY                      Clerk secret key       [masked]
#   NEXT_PUBLIC_MAPBOX_TOKEN              Mapbox GL public token
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY          Web Push VAPID public key
#   NEXT_PUBLIC_AGENCY_URL                Agency panel URL
#   NEXT_PUBLIC_OWNER_URL                 Owner panel URL
#   NEXT_PUBLIC_ADMIN_URL                 Admin panel URL
#   SLACK_WEBHOOK_FRONTEND                (optional) Slack incoming webhook
#   LHCI_TOKEN                            (optional) Lighthouse CI server token
#   CACHE_PREFIX                          bump (e.g. v2) to invalidate all caches
#   VERCEL_TOKEN                          Vercel personal access token    [masked]
#   VERCEL_ORG_ID                         Vercel team/org ID              [masked]
#   VERCEL_PROJECT_ID                     Vercel project ID               [masked]
#
# IMPORTANT — disable Vercel's GitHub auto-deploy so only this pipeline deploys:
#   Vercel dashboard → Project → Settings → Git → "Ignored Build Step" → set to: exit 1
#   (or disconnect the GitHub integration entirely and use this pipeline exclusively)
# ──────────────────────────────────────────────────────────────────────────────

# ── Skip [skip ci] commits ───────────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - prepare
  - quality
  - test
  - build
  - security
  - lighthouse
  - deploy
  - notify

variables:
  NODE_VERSION: "20"
  CACHE_PREFIX: "v1"

# All jobs are interruptible so a new push cancels the in-flight pipeline
default:
  interruptible: true

# ── Shared job templates ──────────────────────────────────────────────────────

# Base for every job that needs node_modules from cache
.node_job:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      prefix: "$CACHE_PREFIX"
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

# Build-time env vars baked into the Next.js bundle
.build_vars:
  variables:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    CLERK_SECRET_KEY: $CLERK_SECRET_KEY
    NEXT_PUBLIC_MAPBOX_TOKEN: $NEXT_PUBLIC_MAPBOX_TOKEN
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: $NEXT_PUBLIC_VAPID_PUBLIC_KEY
    NEXT_PUBLIC_AGENCY_URL: $NEXT_PUBLIC_AGENCY_URL
    NEXT_PUBLIC_OWNER_URL: $NEXT_PUBLIC_OWNER_URL
    NEXT_PUBLIC_ADMIN_URL: $NEXT_PUBLIC_ADMIN_URL

# ── 1. PREPARE ────────────────────────────────────────────────────────────────
install:
  stage: prepare
  extends: .node_job
  cache:
    key:
      prefix: "$CACHE_PREFIX"
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - npm ci --prefer-offline
  retry: 1
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 2. QUALITY (all parallel, all branches) ──────────────────────────────────
typecheck:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npx tsc --noEmit
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

lint:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npm run lint
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

format:
  stage: quality
  extends: .node_job
  needs: [install]
  script:
    - npm run format:check
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 3. TEST ───────────────────────────────────────────────────────────────────
test:unit:
  stage: test
  extends: .node_job
  needs: [typecheck, lint, format]
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 4. BUILD (parallel on protected branches) ────────────────────────────────
build:app:
  stage: build
  extends:
    - .node_job
    - .build_vars
  needs: [test:unit]
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
    expire_in: 1 hour
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

build:storybook:
  stage: build
  extends: .node_job
  needs: [test:unit]
  script:
    - npm run build-storybook
  artifacts:
    when: always
    paths:
      - storybook-static/
    expire_in: 3 days
  allow_failure: true
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ── 5. SECURITY ───────────────────────────────────────────────────────────────
audit:deps:
  stage: security
  extends: .node_job
  needs: [install]
  script:
    - npm audit --audit-level=high --omit=dev
  allow_failure: true
  timeout: 3 minutes
  rules:
    - if: $CI_COMMIT_BRANCH

# ── 6. LIGHTHOUSE ─────────────────────────────────────────────────────────────
lighthouse:
  stage: lighthouse
  extends:
    - .node_job
    - .build_vars
  needs: [build:app]
  before_script:
    - apk add --no-cache chromium
    - export CHROME_PATH=/usr/bin/chromium-browser
    - export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
  script:
    - npm run start &
    - npx wait-on http://localhost:3000 --timeout 60000
    - npx @lhci/cli@latest autorun --config=.lighthouserc.json
  artifacts:
    when: always
    paths:
      - .lighthouseci/
    reports:
      metrics: .lighthouseci/lhr-*.json
    expire_in: 30 days
  allow_failure: true
  retry: 1
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ── 7. DEPLOY ─────────────────────────────────────────────────────────────────
#
# Vercel is driven from here — NOT from its GitHub integration.
# Set "Ignored Build Step" to `exit 1` in Vercel project settings to block
# GitHub-triggered builds.
#
deploy:preview:
  stage: deploy
  extends:
    - .node_job
    - .build_vars
  needs: [build:app, audit:deps]
  script:
    - npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - npx vercel build --token=$VERCEL_TOKEN
    - DEPLOY_URL=$(npx vercel deploy --prebuilt --token=$VERCEL_TOKEN 2>&1 | tail -1)
    - echo "Preview URL $DEPLOY_URL"
    - echo "DEPLOY_URL=$DEPLOY_URL" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 hour
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: $DEPLOY_URL
    auto_stop_in: 3 days
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy:production:
  stage: deploy
  extends:
    - .node_job
    - .build_vars
  needs: [build:app, lighthouse, audit:deps]
  script:
    - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx vercel build --prod --token=$VERCEL_TOKEN
    - DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tail -1)
    - echo "Production URL $DEPLOY_URL"
    - echo "DEPLOY_URL=$DEPLOY_URL" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 hour
  environment:
    name: production
    url: $DEPLOY_URL
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── 8. NOTIFY ─────────────────────────────────────────────────────────────────
notify:failure:
  stage: notify
  image: alpine:latest
  needs:
    - job: typecheck
      optional: true
    - job: lint
      optional: true
    - job: format
      optional: true
    - job: test:unit
      optional: true
    - job: build:app
      optional: true
    - job: build:storybook
      optional: true
    - job: audit:deps
      optional: true
    - job: lighthouse
      optional: true
    - job: deploy:preview
      optional: true
    - job: deploy:production
      optional: true
  when: on_failure
  allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      [ -z "$SLACK_WEBHOOK_FRONTEND" ] && echo "SLACK_WEBHOOK_FRONTEND not set, skipping" && exit 0
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      FAILED_JOBS=$(curl -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?scope[]=failed" 2>/dev/null || echo "[]")
      FAILED_JOB=$(echo "$FAILED_JOBS" | grep -o '"name":"[^"]*"' | head -1 | sed 's/"name":"//;s/"//' || echo "unknown")
      [ -z "$FAILED_JOB" ] && FAILED_JOB="unknown"
      curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"attachments\": [{
            \"color\": \"#dc3545\",
            \"blocks\": [
              {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚨 Frontend Pipeline Failed\", \"emoji\": true}},
              {\"type\": \"section\", \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Failed job:*\n\`$FAILED_JOB\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Author:*\n$GITLAB_USER_NAME\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\n\`$SHORT_SHA\`\"}
              ]},
              {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}},
              {\"type\": \"actions\", \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🔴 View failures\"}, \"style\": \"danger\",
                  \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID/failures\"}
              ]}
            ]
          }]
        }" "$SLACK_WEBHOOK_FRONTEND"
  rules:
    - if: $CI_COMMIT_BRANCH

notify:success:
  stage: notify
  image: alpine:latest
  needs:
    - job: test:unit
    - job: build:app
      optional: true
    - job: lighthouse
      optional: true
    - job: deploy:preview
      optional: true
    - job: deploy:production
      optional: true
  when: on_success
  allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      [ -z "$SLACK_WEBHOOK_FRONTEND" ] && echo "SLACK_WEBHOOK_FRONTEND not set, skipping" && exit 0
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"attachments\": [{
            \"color\": \"#28a745\",
            \"blocks\": [
              {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"✅ Frontend Pipeline Passed\", \"emoji\": true}},
              {\"type\": \"section\", \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Author:*\n$GITLAB_USER_NAME\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\n\`$SHORT_SHA\`\"}
              ]},
              {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}},
              {\"type\": \"actions\", \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚀 View pipeline\"}, \"style\": \"primary\",
                  \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID\"}
              ]}
            ]
          }]
        }" "$SLACK_WEBHOOK_FRONTEND"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"
