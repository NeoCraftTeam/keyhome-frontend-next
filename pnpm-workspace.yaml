allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - ajv@6.14.0
  - flatted@3.4.0 || 3.4.2
  - undici@7.24.0 || 7.28.0 || 7.29.0
  - brace-expansion@1.1.13 || 1.1.16 || 1.1.17 || 1.1.18 || 2.0.3 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.7 || 5.0.8 || 5.0.9
  - picomatch@2.3.2
  - lodash@4.17.24
  - '@grpc/grpc-js@1.9.16'
  - dompurify@3.4.7 || 3.4.8 || 3.4.9 || 3.4.11 || 3.4.12 || 3.4.13
  - js-yaml@4.1.2 || 4.3.0 || 4.3.1
  - ws@7.5.11
  - '@babel/core@7.29.1'
  - postcss@8.5.18 || 8.5.23
  - socket.io-parser@4.2.7
  - fast-uri@3.1.5
  - nanoid@3.3.16 || 3.3.18
  - '@opentelemetry/core@2.8.0'

# Résolutions de sécurité — remontées depuis package.json `pnpm.overrides`,
# que pnpm v10+ n'lit plus (elles y étaient silencieusement ignorées).
# `vite` est épinglé sur 6.4.3 pour dédupliquer : Storybook 8.6 pinne vite@6
# et y liait `@vitejs/plugin-react`, alors que vitest@4 tournait sur vite@7 —
# la double version cassait le typage des plugins dans vitest.config.ts.
overrides:
  'js-cookie@<3.0.6': ^3.0.7
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  '@clerk/shared@<3.47.6': '>=3.47.6'
  'brace-expansion@>=4.0.0 <5.0.6': '>=5.0.6'
  'fast-uri@<3.1.2': '>=3.1.2'
  'minimatch@<3.1.4': ^3.1.4
  'minimatch@>=9.0.0 <9.0.7': ^9.0.7
